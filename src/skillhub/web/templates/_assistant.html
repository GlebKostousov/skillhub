<section class="card border-0 shadow-sm mb-4" aria-label="Окно ассистента">
  <div class="card-body p-4 p-md-5">
    <p class="text-body-secondary mb-2">Помощник</p>
    <h1>SkillHub</h1>
    <p class="lead text-body-secondary">
      Напишите, что сделать, и вставьте запись встречи или текст.
      Режим подберётся сам.
    </p>
    <p
      class="badge text-bg-secondary mb-3"
      data-assistant-badge
      aria-live="polite"
    >
      Режим пока не выбран
    </p>
    <div class="assistant-wait" data-assistant-wait hidden>
      <span class="assistant-spinner" aria-hidden="true"></span>
      <div class="assistant-wait-copy">
        <p class="mb-1" data-assistant-wait-text>Работаю над запросом.</p>
        <p class="assistant-dots mb-0" aria-hidden="true">
          <span></span><span></span><span></span>
        </p>
        <div class="assistant-progress" aria-hidden="true"></div>
      </div>
    </div>
    <form data-assistant-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token | default('', true) }}">
      <div class="mb-3">
        <label class="form-label" for="assistant-intent">Что нужно сделать</label>
        <textarea
          class="form-control"
          id="assistant-intent"
          name="intent"
          rows="3"
          required
        ></textarea>
      </div>
      <div class="mb-4">
        <label class="form-label" for="assistant-material">Текст или запись встречи</label>
        <textarea
          class="form-control"
          id="assistant-material"
          name="material"
          rows="8"
        ></textarea>
      </div>
      <button
        class="btn btn-primary"
        type="submit"
        data-assistant-submit
      >
        <span class="assistant-spinner d-none" data-assistant-spinner aria-hidden="true"></span>
        <span data-assistant-submit-label>Отправить</span>
      </button>
    </form>
    <p
      class="mt-4 mb-0"
      data-assistant-status
      role="status"
      aria-live="polite"
    ></p>
    <div class="mt-3" data-assistant-result></div>
  </div>
</section>

{% include "protocol.html" %}
